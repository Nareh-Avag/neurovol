
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "neural-vol-surface"
version = "2.1.0"
description = "Institutional-grade Neural Volatility Surface Forecasting System"
authors = [{name = "Quant Research Team"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "polars>=0.20",
    "torch>=2.2",
    "pytorch-lightning>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "kafka-python>=2.0",
    "boto3>=1.34",
    "duckdb>=0.10",
    "plotly>=5.20",
    "streamlit>=1.32",
    "mlflow>=2.11",
    "ray[tune]>=2.10",
    "optuna>=3.6",
    "requests>=2.31",
    "websocket-client>=1.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "pyarrow>=15.0",
    "arch>=6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.3",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[project.scripts]
nvsf = "nvsf.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
