name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Pure Python install, no compiler. The cpp-backend tests should skip and the
  # numpy fallback should carry everything else.
  python-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Show versions
        run: python -c "import sys, numpy, scipy; print(sys.version); print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
      - name: Test
        run: pytest -q

  # C++ core + pybind11 module, built with warnings as errors, then the C++
  # unit tests and the full pytest suite against the built extension.
  cpp:
    name: cpp (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cxx: clang++
          - name: macos-clang
            os: macos-latest
            cxx: clang++
          - name: windows-msvc
            os: windows-latest
            cxx: cl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install
        run: pip install -e ".[dev,cpp]"
      - name: Configure
        run: cmake -S cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DNEUROVOL_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: C++ unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Check the extension loads
        run: python -c "import vol_surface_engine.iv_solver as s; assert s.CPP_AVAILABLE, 'C++ extension did not load'; print(s._iv_core.COMPILER, '|', s._iv_core.BUILD_FLAGS)"
      - name: Python tests (including cpp backend)
        run: pytest -q
