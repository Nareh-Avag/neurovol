[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-vol-surface"
version = "0.1.0"
description = "Implied volatility engine (Python + C++), SVI calibration, volatility features, and a backtesting toolkit"
authors = [{name = "Nareh Avagyan"}]
license = {text = "MIT"}
requires-python = ">=3.11"
# Only what the core packages (vol_surface_engine, features, backtesting)
# import unconditionally.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
]

[project.optional-dependencies]
# Build tooling for the optional C++ extension (see cpp/README in the main README).
cpp = ["pybind11>=2.11", "cmake>=3.18", "ninja"]
# GARCH forecast in features/realized_vol.py
garch = ["arch>=6.3"]
# research/analysis (PCA, regime classification, plotly figures)
research = ["scikit-learn>=1.4", "plotly>=5.20", "hmmlearn>=0.3"]
# training/ (Lightning module, datamodule, walk-forward runner)
training = ["torch>=2.2", "pytorch-lightning>=2.2", "pyyaml>=6.0"]
dev = ["pytest>=8.0", "rich>=13.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vol_surface_engine*", "features*", "backtesting*", "research*", "training*", "models*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
